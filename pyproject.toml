[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamilflow"
version = "0.1.0"
description = "Community-maintained utilities for DeepH workflows (not an official DeepH package)."
authors = [
  {name = "Enrico Marazzi", email = "enrico.marazzi@uclouvain.be"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "deepx-dock @ git+https://github.com/kYangLi/DeepH-dock.git",
  "numpy",
  "scipy",
  "h5py",
  "threadpoolctl",
  "pymatgen",
  "spglib",
  "plotly",
  "ase",
  "jobflow",
  "atomate2[aims]",
  "emmet-core",
  "monty",
  "pydantic",
  "typing-extensions",
  "average-minimum-distance",
  "scikit-learn",
  "tomli-w",
]

[project.optional-dependencies]
# GPU eigensolvers (sparse_hamiltonian.dense_backend). cupy-cuda12x is built for CUDA 12: on a
# machine with another CUDA major version, install the matching wheel instead (e.g. cupy-cuda11x).
gpu = ["cupy-cuda12x"]

[project.urls]
Repository = "https://github.com/emarazzi/hamilflow"

[tool.setuptools]
py-modules = ["hamilflow_projection"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hamilflow*"]
